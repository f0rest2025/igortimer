name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write   # required to create GitHub Releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Read project version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build Windows icon
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('logo.png').save('logo.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Validate Python sources
        shell: pwsh
        run: python -m compileall -q .

      - name: Build desktop executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name igortimer `
            --collect-all pynput `
            --collect-all streamlit `
            --collect-all screeninfo `
            --add-data "logo.png;." `
            --add-data "recorder.py;." `
            --add-data "recorder_dialog.py;." `
            --add-data "app.py;." `
            --icon logo.ico `
            main.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion="$env:APP_VERSION" `
            installer\windows.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: igortimer-setup-${{ env.APP_VERSION }}
          path: dist/installer/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "IgorTimer v${{ env.APP_VERSION }} — Screen Recorder"
          body: |
            ## 🎬 Что нового в v${{ env.APP_VERSION }}

            ### Запись экрана
            - Запись всего рабочего стола (авто-определение мониторов, включая двойной)
            - Системный звук через WASAPI loopback (весь звук Windows без настройки)
            - Микрофон подмешивается автоматически, если доступен
            - Поддержка **Паузы/Возобновления** через мульти-сегментную архитектуру
            - Сжатие H.264, CRF 28, 15 FPS — баланс качество/размер

            ### Горячие клавиши записи
            | Действие | По умолчанию |
            |---|---|
            | Начать запись | `Ctrl+Alt+W` |
            | Пауза / Продолжить | `Ctrl+Alt+P` |
            | Остановить и сохранить | `Ctrl+Alt+E` |
            | Открыть поиск | `Ctrl+Alt+F` |

            > Все хоткеи переназначаются в Настройках.

            ### Веб-интерфейс поиска (Streamlit)
            - Запуск: `streamlit run app.py` или `Ctrl+Alt+F`
            - Поиск по имени клиента, фильтр по датам
            - Встроенный HTML5-плеер — смотрите записи прямо в браузере
            - Статистика по времени и размеру

            ### Структура записей
            ```
            recordings/
            └── YYYY-MM-DD/
                └── HH-MM_ИмяКлиента.mp4
            ```
          files: dist/installer/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
